<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="lisateenus-lisatud.css">
</head>
<body>
<div class="popup open" id="popup">
    <div class="popup-box">
      <button class="popup-close" id="popup-close">×</button>

      <h2 class="popup-title">Lisateenus on <span class="popup-green">lisatud</span> Sinu reispaketti!</h2>

      <div class="popup-contacts">
        <div class="popup-contact">
          <img src="IMG/phone.png" alt="Telefon">
          <div>
            <p>Helista meile</p>
            <p><a href="tel:+3724206969">+372 420 6969</a></p>
          </div>
        </div>

        <div class="popup-contact">
          <img src="IMG/chat.png" alt="Vestlus">
          <div>
            <p>Suhtle meiega</p>
            <p>Online chat</p>
          </div>
        </div>

        <div class="popup-contact">
          <img src="IMG/mail.png" alt="E-kiri">
          <div>
            <p>Saada e-kiri</p>
            <p><a href="mailto:oops@paradoxkareisiburoo.ee">oops@paradoxkareisiburoo.ee</a></p>
          </div>
        </div>
      </div>
    </div>
  </div>  
  <script>
    const popup = document.getElementById("popup");
    const closeButton = document.getElementById("popup-close");

    function closePopup() {
      window.parent.postMessage({ type: "close-service-popup" }, "*");
    }

    closeButton.addEventListener("click", closePopup);
    popup.addEventListener("click", function (event) {
      if (event.target === popup) {
        closePopup();
      }
    });
    document.addEventListener("keydown", function (event) {
      if (event.key === "Escape") {
        closePopup();
      }
    });
  </script>
</body>
</html>
