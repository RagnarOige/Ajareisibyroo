<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <title>Reisi päring</title>
    <link rel="stylesheet" href="paring.css">
</head>
<body>

    <div class="container">
        <h1>ESITA PÄRING </h1>
        <p>Anna oma reisi detailid, et saaksid minna maailma avastama!</p>
    </div>

    <h3>Reisi info</h3>

    <div class="fields">
        <div>
            <label>Reisi algus</label>
            <input placeholder="05/11/2026" type="text">
        </div>
        <div>
            <label>Reisi lõpp</label>
            <input placeholder="10/11/2026" type="text">
        </div>
        <div>
            <label>Reisijad</label>
            <input type="number" value="1">
        </div>
    </div>

    <div class="alumine">
        <div>
            <label>Nimi</label>
            <input placeholder="Peeter" type="text">

            <label>Email</label>
            <input placeholder="peeter@exampel.com" type="email">

            <label>Telefon</label>
            <input placeholder="372 555 5555" type="text">
        </div>

        <div>
            <label>Kommentaarid</label>
            <textarea></textarea>
        </div>
    </div>

    <div class="nupud">
        <button class="punane" type="button" onclick="window.location.href='terms.html'">ÜLDTINGIMUSED</button>
        <br>
        <button class="sinine" type="button" onclick="window.location.href='paring-tehtud.html'">MAKSA</button>
    </div>

    <div class="contact-options">
        <div class="contact-item">
            <img src="IMG/phone.png" alt="">
            <div class="contact-details">
                <p>Helista meile</p>
                <p>+372 420 6969</p>
            </div>
        </div>
        <div class="contact-item">
            <img src="IMG/chat.png" alt="">
            <div class="contact-details">
                <p>Suhtle meiega</p>
                <p>Online chat</p>
            </div>
        </div>
        <div class="contact-item">
            <img src="IMG/mail.png" alt="">
            <div class="contact-details">
                <p>Saada e-kiri</p>
                <p>oops@paradoxkareisiburoo.ee</p>
            </div>
        </div>
    </div>


</body>
</html>
